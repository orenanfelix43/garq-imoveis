<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | GARQ Invest</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.473.0/dist/umd/lucide.min.js" defer></script>
    <link rel="stylesheet" href="login.css">
</head>
<body class="bg-[#0a0a0a]">

    <div class="login-container px-6">
        <div class="login-card fade-in">
            <div class="text-center mb-10">
                <a href="index.html" aria-label="Voltar para GARQ Imóveis">
                    <img src="assets/logo.webp" alt="GARQ Imóveis"
                        style="height:48px;width:auto;object-fit:contain;margin:0 auto 16px;"
                        width="140" height="48" loading="eager">
                </a>
                <span class="text-gold uppercase tracking-[0.4em] text-[10px] font-bold block mb-2">Área do Cliente</span>
                <h1 class="text-2xl font-serif text-white">Criar Conta</h1>
            </div>

            <!-- Aviso -->
            <div class="mb-6 p-4 border border-gold/40 bg-gold/10 rounded-sm">
                <div class="flex items-start gap-3">
                    <i data-lucide="info" class="w-4 h-4 text-gold flex-shrink-0 mt-0.5"></i>
                    <p class="text-[11px] uppercase tracking-wider text-gold leading-relaxed font-medium">
                        Após o cadastro, sua conta ficará ativa mas o portfólio de imóveis será vinculado pela equipe GARQ.
                    </p>
                </div>
            </div>

            <form id="cadastroForm" class="space-y-5" novalidate>
                <div>
                    <label for="cadastroNome" class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Nome Completo</label>
                    <input type="text" id="cadastroNome" class="login-input" placeholder="Seu nome completo" autocomplete="name" required>
                </div>
                <div>
                    <label for="cadastroPhone" class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Telefone</label>
                    <input type="tel" id="cadastroPhone" class="login-input" placeholder="(11) 99999-9999" autocomplete="tel" required>
                </div>
                <div>
                    <label for="cadastroEmail" class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">E-mail</label>
                    <input type="email" id="cadastroEmail" class="login-input" placeholder="seunome@email.com.br" autocomplete="email" required>
                </div>
                <div>
                    <label for="cadastroSenha" class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Senha</label>
                    <input type="password" id="cadastroSenha" class="login-input" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                </div>
                <div>
                    <label for="cadastroConfirma" class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Confirmar Senha</label>
                    <input type="password" id="cadastroConfirma" class="login-input" placeholder="Repita a senha" autocomplete="new-password" required>
                </div>

                <p id="cadastroErro" role="alert"
                    class="hidden text-[9px] uppercase tracking-tighter text-red-500 font-bold italic text-center">
                </p>

                <button type="submit" id="cadastroBtn"
                    class="w-full bg-gold text-black py-5 font-bold uppercase text-[10px] tracking-[0.3em] hover:bg-white transition-all shadow-lg mt-2">
                    Criar Conta
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-[11px] uppercase tracking-widest text-gray-400 font-light">
                    Já tem uma conta?
                    <a href="login.html" class="register-link ml-1">Entrar</a>
                </p>
            </div>

            <div class="mt-8 pt-6 border-t border-white/5 text-center">
                <a href="index.html" class="text-[10px] uppercase tracking-widest text-gray-500 hover:text-gold transition">
                    <i data-lucide="arrow-left" class="w-3 h-3 inline mr-1"></i> Voltar ao início
                </a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
    <script>
        window.__GARQ_CONFIG__ = {
            API_URL: ['localhost', '127.0.0.1'].includes(window.location.hostname)
                ? 'http://localhost:5000/api'
                : '/api'
        };
    </script>
    <script type="module" src="src/cadastro-cliente.js"></script>
</body>
</html>
