<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações | GARQ Imóveis</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="min-h-screen bg-[#0a0a0a] text-[#fdfdfd] flex flex-col md:flex-row">

<div id="toast-container" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

<!-- Sidebar -->
<aside class="w-full md:w-72 md:h-screen md:sticky md:top-0 glass-panel border-b md:border-b-0 md:border-r border-white/5 flex flex-col z-50">
    <div class="p-8 border-b border-white/5 flex justify-center items-center">
        <img src="assets/logo.webp" alt="GARQ Imóveis" class="h-12 w-auto object-contain brightness-110">
    </div>
    <div class="p-8 border-b border-white/5 bg-white/[0.02]">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-gold/20 border border-gold/30 flex items-center justify-center text-gold">
                <i data-lucide="user" class="w-6 h-6"></i>
            </div>
            <div>
                <h4 id="user-name-display" class="text-sm font-bold uppercase tracking-tight">Seu Nome</h4>
                <p id="user-role-display" class="text-[10px] text-gold uppercase tracking-[0.2em] font-medium">Seu Cargo</p>
            </div>
        </div>
    </div>
    <nav class="flex-1 p-6 space-y-2">
        <p class="text-[9px] uppercase tracking-[0.3em] text-gray-500 mb-4 ml-2">Menu Principal</p>
        <a href="admin.html" class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white transition-all group">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span class="text-xs uppercase tracking-widest">Imóveis</span>
        </a>
        <a href="configuracoes.html" class="flex items-center gap-3 p-3 rounded-lg bg-gold/10 text-gold border border-gold/20 group transition-all">
            <i data-lucide="settings-2" class="w-4 h-4"></i>
            <span class="text-xs uppercase tracking-widest font-semibold">Configurações</span>
        </a>
        <a href="index.html" class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white transition-all group">
            <i data-lucide="external-link" class="w-4 h-4"></i>
            <span class="text-xs uppercase tracking-widest">Voltar para o Site</span>
        </a>
    </nav>
    <div class="p-6 border-t border-white/5">
        <button id="logout-btn" class="w-full flex items-center gap-3 p-3 rounded-lg text-red-400 hover:bg-red-500/10 transition-all group">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span class="text-xs uppercase tracking-widest">Sair do Painel</span>
        </button>
    </div>
</aside>

<!-- Main -->
<main class="flex-1 p-6 md:p-12 max-w-5xl mx-auto w-full">

    <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
        <div>
            <p class="text-gold text-[10px] uppercase tracking-[0.4em] mb-2">Painel Administrativo</p>
            <h2 class="text-3xl font-serif uppercase tracking-tight">Configurações</h2>
        </div>
        <button onclick="abrirModalNovaLista()" class="btn-primary flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i> Nova Lista
        </button>
    </div>

    <div id="listas-container" class="space-y-6">
        <div class="p-20 text-center text-gray-500 text-xs uppercase tracking-widest">Carregando configurações...</div>
    </div>

</main>

<!-- Modal Nova Lista -->
<div id="modal-nova-lista" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-[100] items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border-gold/20">
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/[0.02]">
            <h3 class="font-serif text-lg uppercase tracking-widest text-gold">Nova Lista</h3>
            <button onclick="fecharModalNovaLista()" class="text-gray-400 hover:text-white transition"><i data-lucide="x"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-400 mb-2">Título da Lista</label>
                <input type="text" id="nova-lista-titulo" class="input-field" placeholder="Ex: Características Extras">
            </div>
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-400 mb-2">Descrição (opcional)</label>
                <input type="text" id="nova-lista-descricao" class="input-field" placeholder="Ex: Itens adicionais do imóvel">
            </div>
            <div class="flex justify-end gap-4 pt-2">
                <button onclick="fecharModalNovaLista()" class="px-5 py-2 text-xs uppercase tracking-widest text-gray-400 hover:text-white">Cancelar</button>
                <button onclick="criarLista()" class="btn-primary">Criar Lista</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Novo Item -->
<div id="modal-novo-item" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-[100] items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border-gold/20">
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/[0.02]">
            <h3 class="font-serif text-lg uppercase tracking-widest text-gold">Novo Item</h3>
            <button onclick="fecharModalNovoItem()" class="text-gray-400 hover:text-white transition"><i data-lucide="x"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-400 mb-2">Label (exibido no select)</label>
                <input type="text" id="novo-item-label" class="input-field" placeholder="Ex: Cobertura">
            </div>
            <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-400 mb-2">Valor interno</label>
                <input type="text" id="novo-item-valor" class="input-field" placeholder="Gerado automaticamente do label">
            </div>
            <p class="text-[9px] text-gray-600 uppercase tracking-widest">O valor interno é usado no banco de dados. Gerado automaticamente se deixado em branco.</p>
            <div class="flex justify-end gap-4 pt-2">
                <button onclick="fecharModalNovoItem()" class="px-5 py-2 text-xs uppercase tracking-widest text-gray-400 hover:text-white">Cancelar</button>
                <button onclick="adicionarItem()" class="btn-primary">Adicionar</button>
            </div>
        </div>
    </div>
</div>

<script type="module" src="src/configuracoes.js"></script>
</body>
</html>
