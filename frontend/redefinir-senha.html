<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha | GARQ Invest</title>

    <link rel="icon" type="image/jpeg" href="assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="login.css">
</head>

<body class="bg-[#0a0a0a]">

    <div class="login-container px-6">
        <div class="login-card fade-in">
            <div class="text-center mb-10">
                <i data-lucide="shield-check" class="text-gold w-10 h-10 mx-auto mb-4"></i>
                <h2 class="text-2xl font-serif text-white">Nova Senha</h2>
                <p class="text-[10px] uppercase tracking-widest text-gray-500 mt-2">Crie uma combinação forte e segura.</p>
            </div>

            <form id="resetForm" class="space-y-6">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Nova Senha</label>
                    <input type="password" id="newPassword" class="login-input" placeholder="••••••••" required minlength="6">
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Confirmar Nova Senha</label>
                    <input type="password" id="confirmPassword" class="login-input" placeholder="••••••••" required minlength="6">
                    <p id="errorMessage" class="hidden text-[9px] uppercase tracking-tighter text-red-500 mt-2 font-bold italic">As senhas não coincidem.</p>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-gold text-black py-5 font-bold uppercase text-[10px] tracking-[0.3em] hover:bg-white transition-all shadow-lg">
                    Atualizar Senha
                </button>
            </form>

            <div id="successMessage" class="hidden text-center py-4">
                <i data-lucide="check-circle" class="text-green-500 w-12 h-12 mx-auto mb-4"></i>
                <p class="text-white text-sm font-light mb-6">Sua senha foi atualizada com sucesso!</p>
                <a href="login.html" class="inline-block bg-white/10 hover:bg-white/20 text-white px-6 py-3 rounded text-[10px] uppercase tracking-widest transition">
                    Ir para Login
                </a>
            </div>
        </div>
    </div>

    <script src="src/reset-password.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
