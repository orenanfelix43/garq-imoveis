<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | GARQ Invest</title>

    <link rel="icon" type="image/jpeg" href="assets/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="login.css">
</head>

<body class="bg-[#0a0a0a]">

    <div class="login-container px-6 py-12">
        <div class="login-card fade-in">
            <div class="text-center mb-8">
                <i data-lucide="user-plus" class="text-gold w-10 h-10 mx-auto mb-4"></i>
                <h2 class="text-2xl font-serif text-white">Criar Conta</h2>
                <p class="text-[10px] uppercase tracking-widest text-gray-500 mt-2">Preencha os dados para acessar a
                    plataforma</p>
            </div>

            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">Nome de
                        Usuário</label>
                    <input type="text" id="regUser" class="login-input" placeholder="Usuário" required>
                </div>

                <div>
                    <label
                        class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">E-mail</label>
                    <input type="email" id="regEmail" class="login-input" placeholder="exemplo@garq.com" required>
                </div>

                <div>
                    <label
                        class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">Celular</label>
                    <input type="tel" id="regPhone" class="login-input" placeholder="(00) 00000-0000" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label
                            class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">Senha</label>
                        <input type="password" id="regPass" class="login-input" placeholder="******" required>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-1">Confirmar
                            Senha</label>
                        <input type="password" id="regConfirmPass" class="login-input" placeholder="******" required>
                    </div>
                </div>

                <p id="regErrorMessage"
                    class="hidden text-[9px] uppercase tracking-tighter text-red-500 mt-2 font-bold italic">As senhas
                    não coincidem.</p>

                <button type="submit"
                    class="w-full bg-gold text-black py-5 mt-4 font-bold uppercase text-[10px] tracking-[0.3em] hover:bg-white transition-all shadow-lg">
                    Finalizar Cadastro
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/5 text-center">
                <p class="text-[10px] uppercase tracking-widest text-gray-500">
                    Já possui uma conta?
                    <a href="login.html" class="text-gold hover:text-white transition ml-1">Entrar</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="src/auth-handler.js"></script>
</body>

</html>
